# H2 profile — TEMPORARY, for testing the deployed app on Render.
# Activate by setting  SPRING_PROFILES_ACTIVE=h2  on the Render service.
# NOTE: in-memory DB — data is wiped on every restart/redeploy.
# To switch back to PostgreSQL, just remove that env var and redeploy.
spring:
  datasource:
    url: jdbc:h2:mem:nmsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
