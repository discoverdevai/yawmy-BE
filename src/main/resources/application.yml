server:
  port: 8080
  error:
    # Include the thrown message in the JSON body so the app can show it to users
    # (e.g. "Email not found or incorrect email"). Spring hides it by default.
    include-message: always

spring:
  application:
    name: nursery-back-end

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

  datasource:
    url: jdbc:postgresql://${POSTGRESQL_ADDON_HOST:bprwanjsro5syxr6p0d9-postgresql.services.clever-cloud.com}:${POSTGRESQL_ADDON_PORT:50013}/${POSTGRESQL_ADDON_DB:bprwanjsro5syxr6p0d9}
    username: ${POSTGRESQL_ADDON_USER}
    password: ${POSTGRESQL_ADDON_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Clever Cloud's free Postgres caps connections per role (~5). Keep the pool
      # small so a single instance — and brief old+new overlap during a deploy —
      # never exceeds it. Override with DB_POOL_SIZE if you move to a bigger DB.
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 60000       # drop idle connections after 60s
      max-lifetime: 300000      # recycle connections every 5 min (avoids stale/zombie)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cors:
    # Comma-separated browser origins allowed to call the API (web clients).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:8084,http://127.0.0.1:8084,http://localhost:8085,http://127.0.0.1:8085}
  rate-limit:
    # Per-client limits on login, password reset and invite endpoints.
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 14
  invite:
    ttl-hours: 48
    link-base-url: ${APP_INVITE_LINK_BASE_URL:nurseryadmin://invitation}
    teacher-link-base-url: ${APP_TEACHER_INVITE_LINK_BASE_URL:nurseryteacher://invitation}
    parent-link-base-url: ${APP_PARENT_INVITE_LINK_BASE_URL:nurseryparent://invitation}
  mail:
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Yawmy Care}
  password-reset:
    ttl-minutes: 15       # overall reset session cap
    otp-ttl-seconds: 300  # each emailed OTP is valid for 5 minutes
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${APP_BOOTSTRAP_ADMIN_FULL_NAME:Root Admin}
  chat:
    # Re-derive every room group's membership at boot. Idempotent, so it also
    # repairs any drift; set false only if the room count ever makes it costly.
    reconcile-on-startup: ${CHAT_RECONCILE_ON_STARTUP:true}
  media:
    # Local disk is only the fallback, used when no bucket is configured, so the
    # app still runs with no AWS account. Anything deployed should set
    # AWS_S3_BUCKET_NAME — the container filesystem does not survive a redeploy.
    local:
      root: ${MEDIA_ROOT:./uploads}
    s3:
      bucket: ${AWS_S3_BUCKET_NAME:}
      region: ${AWS_REGION:eu-central-1}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      # Blank for real AWS. Set it to use any S3-compatible provider instead —
      # Supabase Storage, Cloudflare R2, Backblaze B2, MinIO. Path-style
      # addressing follows from having an endpoint unless forced either way.
      endpoint: ${AWS_S3_ENDPOINT:}
      path-style: ${AWS_S3_PATH_STYLE:}
